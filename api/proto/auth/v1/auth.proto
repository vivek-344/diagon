syntax = "proto3";

package diagon.auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vivek-344/diagon/gen/auth/v1;authv1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  User user = 1;
}

message User {
  string id = 1;
  string email = 2;
  google.protobuf.Timestamp created_at = 3;
}